services:
  quadrogent-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: quadrogent-sandbox
    network_mode: host
    environment:
      - HOME=/home/quadrogent
    volumes:
      - quadrogent-home:/home/quadrogent
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  quadrogent-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quadrogent-backend
    network_mode: host
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/quadrogent.db
      - SANDBOX_API_URL=http://localhost:5000
    volumes:
      - quadrogent-db:/app/data
    depends_on:
      quadrogent-sandbox:
        condition: service_healthy

  quadrogent-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quadrogent-frontend
    network_mode: host
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - quadrogent-backend

volumes:
  quadrogent-home:
  quadrogent-db:
